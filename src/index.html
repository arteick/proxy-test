<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Онлайн-редактор кода</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: #1e1e1e; color: #ccc; font: 13px system-ui, sans-serif; }
  #side { width: 240px; background: #252526; display: flex; flex-direction: column; border-right: 1px solid #333; }
  #side header { padding: 8px; display: flex; gap: 6px; align-items: center; text-transform: uppercase; font-size: 11px; }
  #side header span { flex: 1; }
  button { background: #333; color: #ccc; border: 0; border-radius: 3px; padding: 3px 7px; cursor: pointer; }
  button:hover { background: #444; }
  #tree { flex: 1; overflow: auto; }
  .item { padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .item:hover { background: #2a2d2e; }
  .item.active { background: #37373d; color: #fff; }
  .item.target { outline: 1px solid #0e639c; outline-offset: -1px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #tab { padding: 8px 12px; background: #2d2d2d; border-bottom: 1px solid #333; }
  #hint { padding: 4px 12px; font-size: 11px; color: #888; background: #252526; }
  #editor { flex: 1; overflow: auto; position: relative; font: 14px/20px Consolas, "DejaVu Sans Mono", monospace; cursor: text; }
  .line { display: flex; min-height: 20px; }
  .num { width: 48px; flex: none; text-align: right; padding-right: 12px; color: #858585; user-select: none; }
  .text { white-space: pre; flex: 1; color: #d4d4d4; }
  .line.has-cursor { background: #262626; }
  .cur { display: inline-block; width: 0; height: 18px; border-left: 2px solid #aeafad; vertical-align: text-bottom; margin-left: -1px; margin-right: -1px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #input { position: fixed; opacity: 0; width: 1px; height: 1px; left: 0; top: 0; }
  #empty { padding: 24px; color: #888; }
</style>
</head>
<body>
<aside id="side">
  <header><span>Проводник</span><button id="newFile" title="Новый файл">+ файл</button><button id="newDir" title="Новая папка">+ папка</button></header>
  <div id="tree"></div>
</aside>
<section id="main">
  <div id="tab">Файл не выбран</div>
  <div id="hint">Alt+клик или Ctrl+Alt+↑/↓ — добавить курсор; Esc — оставить один. Печать, Enter, Backspace, Delete, стрелки работают на всех курсорах.</div>
  <div id="editor"><div id="empty">Создайте или выберите файл слева.</div></div>
  <textarea id="input" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
</section>
<script type="module" src="app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));</script>
</body>
</html>
