name: Godot
on:
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:
env:
  GODOT_VERSION: "4.3"
jobs:
  test-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Тесты логики
        run: godot --headless --path godot -s tests/run.gd
      - name: Экспорт в Web
        run: |
          mkdir -p build/web ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          godot --headless --path godot --import || true
          godot --headless --path godot --export-release Web ../build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: build/web
